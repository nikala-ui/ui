name: Index Algolia Search

on:
  push:
    branches:
      - main
    paths:
      - "packages/core/registry/**"
      - "packages/core/src/**"
      - "packages/hooks/src/**"
      - "apps/web/src/routes/**"
      - "apps/web/src/config/docs.ts"
      - ".github/scripts/index-algolia.ts"
  workflow_dispatch:

concurrency:
  group: algolia-index-${{ github.ref }}
  cancel-in-progress: true

jobs:
  index:
    name: Sync Algolia Records
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Algolia Indexing
        run: bun run .github/scripts/index-algolia.ts
        env:
          ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID || '3OJO76EK9R' }}
          ALGOLIA_ADMIN_API_KEY: ${{ secrets.ALGOLIA_ADMIN_API_KEY }}
          ALGOLIA_INDEX_NAME: ${{ secrets.ALGOLIA_INDEX_NAME || 'nikala_docs' }}
