name: Nikala UI Release Pipeline

run-name: ${{ github.event_name == 'pull_request' && 'PR Validation' || 'Production Release' }}

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  workspace-check:
    name: Validate and Build Workspace
    if: ${{ github.repository_owner == 'nikala-ui' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build All Monorepo Packages
        run: bun run build

      - name: Verify Registry Manifests Sync
        run: git diff --exit-code packages/core/registry

      - name: Typecheck Monorepo Packages
        run: |
          cd packages/core && bunx tsc --noEmit
          cd ../hooks && bunx tsc --noEmit
          cd ../cli && bunx tsc --noEmit
          cd "../../apps/web" && bunx tsc --noEmit

      - name: Execute Web App Tests
        run: cd apps/web && bunx vitest run

  npm-publish:
    name: Publish Packages to NPM & GitHub Releases
    needs: workspace-check
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository_owner == 'nikala-ui' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Workspace Dependencies
        run: bun install --frozen-lockfile

      - name: Compile Registry Manifests & Build Packages
        run: bun run build

      - name: Setup Node for OIDC & NPM Auth
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish @nikala-ui/hooks Package
        run: |
          cd packages/hooks
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@nikala-ui/hooks@${VERSION}" version >/dev/null 2>&1; then
            echo "@nikala-ui/hooks@${VERSION} is already published; skipping."
          else
            npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @nikala-ui/core Package
        run: |
          cd packages/core
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@nikala-ui/core@${VERSION}" version >/dev/null 2>&1; then
            echo "@nikala-ui/core@${VERSION} is already published; skipping."
          else
            npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @nikala-ui/cli Package
        run: |
          cd packages/cli
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@nikala-ui/cli@${VERSION}" version >/dev/null 2>&1; then
            echo "@nikala-ui/cli@${VERSION} is already published; skipping."
          else
            npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @nikala-ui/mcp Package
        run: |
          cd packages/mcp
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@nikala-ui/mcp@${VERSION}" version >/dev/null 2>&1; then
            echo "@nikala-ui/mcp@${VERSION} is already published; skipping."
          else
            npm publish --access public --provenance
          fi

        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Generate Changelog and Update Documentation
        run: bun run changelog

      - name: Commit Changelog on Dedicated Branch
        id: changelog-branch
        env:
          CHANGELOG_BRANCH: chore/changelog-${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin "$CHANGELOG_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$CHANGELOG_BRANCH"
            git switch --create "$CHANGELOG_BRANCH" --track "origin/$CHANGELOG_BRANCH"
          else
            git switch --create "$CHANGELOG_BRANCH"
          fi

          git add CHANGELOG.md docs/changelogs/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Changelog is already up-to-date."
          else
            git commit -m "docs(changelog): update changelog for ${{ github.ref_name }}"
            git push --set-upstream origin "$CHANGELOG_BRANCH"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open Changelog Pull Request
        if: steps.changelog-branch.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGELOG_BRANCH: chore/changelog-${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh pr list --base main --head "$CHANGELOG_BRANCH" --state open --json number --jq 'length' | grep -q '^0$'; then
            gh pr create \
              --base main \
              --head "$CHANGELOG_BRANCH" \
              --title "docs(changelog): update changelog for ${{ github.ref_name }}" \
              --body "Automated changelog update for \`${{ github.ref_name }}\`."
          else
            echo "An open changelog pull request already exists for $CHANGELOG_BRANCH."
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: docs/changelogs/${{ github.ref_name }}.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
